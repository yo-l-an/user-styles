# Local stack
version: "3.9"

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file

services:
  web:
    <<: *defaults
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_DEBUG: true
      MAX_UPLOAD_MB: 25
    depends_on: [db]

  db:
    <<: *defaults
    image: postgres:16-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 10s

volumes:
  db-data: {}
